<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Agent Room</title>
  <link rel="stylesheet" href="/assets/styles.css">
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div>
        <div class="eyebrow">AI AGENT ROOM</div>
        <h1>Команда виртуальных сотрудников</h1>
        <p id="modeText">Подключение...</p>
      </div>
      <div class="health" id="healthBadge">CHECKING</div>
    </header>

    <main class="layout">
      <section class="room-panel">
        <div class="section-heading">
          <div>
            <span class="eyebrow">TEAM</span>
            <h2>Агенты</h2>
          </div>
          <span class="muted" id="agentCount">0 agents</span>
        </div>
        <div class="agent-grid" id="agentGrid"></div>
      </section>

      <aside class="side-panel">
        <section class="composer card">
          <span class="eyebrow">ORCHESTRATOR</span>
          <h2>Поставить задачу</h2>
          <textarea id="taskInput" maxlength="4000" placeholder="Например: проверь синхронизацию сотрудника с Excel"></textarea>
          <button id="sendTask">Сформировать план</button>
          <div id="planResult" class="plan-result" hidden></div>
        </section>

        <section class="activity card">
          <div class="section-heading compact">
            <div>
              <span class="eyebrow">LIVE</span>
              <h2>Activity Feed</h2>
            </div>
          </div>
          <div id="activityFeed" class="feed"></div>
        </section>
      </aside>
    </main>
  </div>

  <template id="agentCardTemplate">
    <article class="agent-card">
      <div class="desk-light"></div>
      <div class="avatar"></div>
      <div class="agent-copy">
        <div class="agent-title-row">
          <h3 class="agent-name"></h3>
          <span class="status-pill"></span>
        </div>
        <p class="agent-role"></p>
        <p class="current-task">Нет активной задачи</p>
        <div class="agent-metrics">
          <div><span>TODAY</span><strong class="today">0</strong></div>
          <div><span>GOAL</span><strong class="goal">0</strong></div>
        </div>
      </div>
    </article>
  </template>

  <script src="/assets/app.js" defer></script>
</body>
</html>
